[project]
name = "scriptbot"
version = "0.1.0"
description = "Telegram bot + admin backend for manga aggregation and export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "aiogram>=3.10.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "selectolax>=0.3.21",
  "playwright>=1.46.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "img2pdf>=0.5.1",
  "reportlab>=4.2.0",
  "ebooklib>=0.18",
  "python-slugify>=8.0.4",
  "rapidfuzz>=3.9.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
